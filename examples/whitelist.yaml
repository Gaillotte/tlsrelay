# Whitelist of the server tlsrelay (SPEC §6). Reloaded automatically
# when the file changes; an invalid file is ignored (the whitelist in
# force is kept).
#
#   name:    unique name of the entry
#   ip:      IPv4/IPv6 address or CIDR range (network address)
#   ports:   subset of [plain, tls, mtls]; by default all ports,
#            except mtls if no subject is given
#   subject: exact subject of the client certificate (RFC 4514), required for mtls;
#            the certificate must also be issued by the Clients CA
peers:
  - name: local-host
    ip: 127.0.0.1
    ports: [plain, tls]

  # - name: branch-lyon
