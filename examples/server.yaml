# Exemple de configuration en mode serveur (SPEC §8.2).
# tlsrelay accepte les connexions sur le port 9001 et les relaie en clair
# vers la destination.
mode: server
instance: exemple-serveur

logging:
  level: info
  format: text
  output: stderr

destination:
  address: 127.0.0.1
  port: 8080
  dial_timeout: 5s
  dial_retries: 3
  dial_backoff: 1s

limits:
  idle_timeout: 5m
  max_channels: 5000
  shutdown_timeout: 30s

ports:
  plain:
    listen: "0.0.0.0:9001"
  # TLS 1.3 : nécessite credentials.pki_root (voir tools/make-test-pki.sh)
  # tls:  { listen: "0.0.0.0:9002" }
  # mTLS : disponible à partir de la phase 3
  # mtls: { listen: "0.0.0.0:9003" }
