# Exemple de configuration en mode client (SPEC §8.1).
# L'application se connecte en clair sur 127.0.0.1:7001 ; tlsrelay relaie vers
# le tlsrelay serveur.
mode: client
instance: exemple-client

logging:
  level: info          # error | info | debug | trace
  format: text         # text | json
  output: stderr       # stderr | chemin de fichier

limits:
  idle_timeout: 5m
  max_channels: 5000
  shutdown_timeout: 30s

ports:
  plain:
    listen: "127.0.0.1:7001"
    upstream: "127.0.0.1:9001"
  # Disponibles à partir de la phase 2 (TLS 1.3) et de la phase 3 (mTLS) :
  # tls:  { listen: "127.0.0.1:7002", upstream: "relay.example:9002", server_name: relay.example }
  # mtls: { listen: "127.0.0.1:7003", upstream: "relay.example:9003", server_name: relay.example }
