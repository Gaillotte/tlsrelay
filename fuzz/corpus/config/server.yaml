# Example configuration in server mode (SPEC §8.2).
# tlsrelay accepts connections on port 9001 and relays them in plain text
# to the destination.
mode: server
instance: example-server

logging:
  level: info
  format: text
  output: stderr

# Peers (client tlsrelays) allowed to connect (SPEC §6).
whitelist:
  file: examples/whitelist.yaml   # path relative to the current directory
  revoke_mode: immediate          # immediate | next_renegotiation

destination:
  address: 127.0.0.1
  port: 8080
  dial_timeout: 5s
  dial_retries: 3
  dial_backoff: 1s

limits:
  idle_timeout: 5m
  max_channels: 5000
  shutdown_timeout: 30s

ports:
  plain:
    listen: "0.0.0.0:9001"
  # TLS 1.3: requires credentials.pki_root (see tools/make-test-pki.sh)
  # tls:  { listen: "0.0.0.0:9002" }
  # mTLS: also requires credentials.pki_root
  # mtls: { listen: "0.0.0.0:9003" }

# Administration channel (tlsrelay status/stop/reload..., SPEC §10.1).
# Default: /run/tlsrelay/<instance>.sock or \\.\pipe\tlsrelay-<instance>.
# admin:
#   endpoint: /tmp/tlsrelay-example.sock
#   enabled: true
