# Exemple de configuration en mode serveur (SPEC §8.2).
# tlsrelay accepte les connexions sur le port 9001 et les relaie en clair
# vers la destination.
mode: server
instance: exemple-serveur

logging:
  level: info
  format: text
  output: stderr

# Pairs (tlsrelay clients) autorisés à se connecter (SPEC §6).
whitelist:
  file: examples/whitelist.yaml   # chemin relatif au répertoire courant
  revoke_mode: immediate          # immediate | next_renegotiation

destination:
  address: 127.0.0.1
  port: 8080
  dial_timeout: 5s
  dial_retries: 3
  dial_backoff: 1s

limits:
  idle_timeout: 5m
  max_channels: 5000
  shutdown_timeout: 30s

ports:
  plain:
    listen: "0.0.0.0:9001"
  # TLS 1.3 : nécessite credentials.pki_root (voir tools/make-test-pki.sh)
  # tls:  { listen: "0.0.0.0:9002" }
  # mTLS : nécessite aussi credentials.pki_root
  # mtls: { listen: "0.0.0.0:9003" }

# Canal d'administration (tlsrelay status/stop/reload..., SPEC §10.1).
# Par défaut : /run/tlsrelay/<instance>.sock ou \\.\pipe\tlsrelay-<instance>.
# admin:
#   endpoint: /tmp/tlsrelay-exemple.sock
#   enabled: true
