# Répétition des performances et de l'endurance pour traquer un défaut
# intermittent : sur demande, ou à chaque push sur une branche stress/*.
name: Stress performances

on:
  workflow_dispatch:
  push:
    branches: ['stress/**']

jobs:
  stress:
    name: Essai ${{ matrix.run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4

      - name: Dépendances
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libssl-dev libasio-dev \
            libyaml-cpp-dev libspdlog-dev libcli11-dev

      - name: Compilation
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DTLSRELAY_BUILD_TESTS=OFF
          cmake --build build

      - name: Boucle locale à MTU 1500 (essais pairs)
        if: contains(fromJSON('[2, 4, 6]'), matrix.run)
        run: sudo ip link set lo mtu 1500 && ip link show lo

      - name: Objectifs de performance (3 fois)
        run: for i in 1 2 3; do echo "=== passe $i"; bash tests/perf/perf.sh build 1000 || exit 1; done

      - name: Endurance
        if: always()
        run: bash tests/perf/soak.sh build 4
