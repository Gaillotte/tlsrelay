# Repeats the performance and soak runs to track down an intermittent
# defect: on demand, or on every push to a stress/* branch.
# RATE=0 and STREAM_RATE=0 in the environment: saturated streams (known limit).
name: Performance stress

on:
  workflow_dispatch:
  push:
    branches: ['stress/**']

jobs:
  stress:
    name: Run ${{ matrix.run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libssl-dev libasio-dev \
            libyaml-cpp-dev libspdlog-dev libcli11-dev

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DTLSRELAY_BUILD_TESTS=OFF
          cmake --build build

      - name: Performance targets (3 times)
        run: for i in 1 2 3; do echo "=== pass $i"; bash tests/perf/perf.sh build 1000 || exit 1; done

      - name: Soak
        if: always()
        run: bash tests/perf/soak.sh build 4
