name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "GCC Release", cxx: g++, build_type: Release, sanitizers: "" }
          - { name: "Clang Release", cxx: clang++, build_type: Release, sanitizers: "" }
          - { name: "Clang ASan+UBSan", cxx: clang++, build_type: Debug, sanitizers: "address,undefined" }
          - { name: "Clang TSan", cxx: clang++, build_type: Debug, sanitizers: "thread" }
    steps:
      - uses: actions/checkout@v4

      - name: Dépendances
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libssl-dev libasio-dev \
            libyaml-cpp-dev libspdlog-dev libcli11-dev libgtest-dev libclang-rt-18-dev qt6-base-dev

      - name: Configuration
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DTLSRELAY_WARNINGS_AS_ERRORS=ON
          -DTLSRELAY_BUILD_ADMIN=ON
          -DTLSRELAY_SANITIZERS=${{ matrix.sanitizers }}

      - name: Compilation
        run: cmake --build build

      - name: Tests
        working-directory: build
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: ctest --output-on-failure -j 2

      - name: Cycle de vie sous systemd (service réel)
        if: matrix.name == 'GCC Release'
        run: sudo bash tests/lifecycle/systemd.sh build/src/app/tlsrelay

      - name: Configuration TLS vue de l'extérieur (sslyze, testssl.sh)
        if: matrix.name == 'GCC Release'
        run: |
          python3 -m venv /tmp/sslyze
          /tmp/sslyze/bin/pip install -q sslyze
          git clone -q --depth 1 --branch v3.2.1 https://github.com/testssl/testssl.sh.git /tmp/testssl
          TESTSSL=/tmp/testssl/testssl.sh PATH="/tmp/sslyze/bin:$PATH" bash tests/lifecycle/tls-scan.sh build/src/app/tlsrelay

      - name: Vulnérabilités des dépendances
        if: matrix.name == 'GCC Release'
        run: bash tools/check-deps.sh

      - name: Durcissement des exécutables
        if: matrix.name == 'GCC Release'
        run: bash tools/check-hardening.sh build/src/app/tlsrelay build/src/testkit/tlsrelay-testkit

      - name: Recette automatisée (mode console)
        if: matrix.name == 'GCC Release'
        shell: pwsh
        run: ./tools/recette.ps1 -BuildDir build/src/app -TestkitDir build/src/testkit -Quick -WorkDir recette

      - name: Rapport de recette (Linux)
        if: always() && matrix.name == 'GCC Release'
        uses: actions/upload-artifact@v4
        with:
          name: recette-linux
          path: |
            recette/rapport.md
            recette/logs/
          if-no-files-found: ignore

  perf:
    name: Performances (1 000 canaux) et endurance (4 min)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Dépendances
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libssl-dev libasio-dev \
            libyaml-cpp-dev libspdlog-dev libcli11-dev

      - name: Compilation
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DTLSRELAY_BUILD_TESTS=OFF
          cmake --build build

      - name: Objectifs de performance
        run: bash tests/perf/perf.sh build 1000 perf.json

      - name: Endurance (rotations, renégociations, coupures)
        run: bash tests/perf/soak.sh build 4 soak.csv

      - name: Rapports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performances
          path: |
            perf.json
            soak.csv

  openssl35:
    name: Linux OpenSSL 3.5 LTS
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      OPENSSL_VERSION: 3.5.9
      OPENSSL_SHA512: c4c8136fd2c98d13bb85a57bfb0def25c906f47f1fe97675cd114594944eab957b5b81a3e0f48826e1a0f093afff5e83766b539d49768f6db68310fd678d7de6
    steps:
      - uses: actions/checkout@v4

      - name: Dépendances
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libasio-dev libyaml-cpp-dev \
            libspdlog-dev libcli11-dev libgtest-dev

      - name: Cache OpenSSL
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/openssl
          key: openssl-${{ env.OPENSSL_VERSION }}-ssldirs-ubuntu-24.04

      - name: OpenSSL ${{ env.OPENSSL_VERSION }} (archive officielle vérifiée)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSLO "https://github.com/openssl/openssl/releases/download/openssl-$OPENSSL_VERSION/openssl-$OPENSSL_VERSION.tar.gz"
          echo "$OPENSSL_SHA512  openssl-$OPENSSL_VERSION.tar.gz" | sha512sum -c -
          tar xzf "openssl-$OPENSSL_VERSION.tar.gz"
          cd "openssl-$OPENSSL_VERSION"
          ./Configure --prefix="$HOME/openssl" --libdir=lib shared no-tests
          make -j"$(nproc)" >/dev/null
          make install_sw install_ssldirs >/dev/null  # install_ssldirs : openssl.cnf (commande openssl req)

      - name: Configuration et compilation
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DTLSRELAY_WARNINGS_AS_ERRORS=ON \
            -DOPENSSL_ROOT_DIR="$HOME/openssl"
          cmake --build build

      - name: Tests
        working-directory: build
        env:
          LD_LIBRARY_PATH: /home/runner/openssl/lib
        # Les scénarios utilisent aussi la commande openssl : celle de la même version.
        run: |
          export PATH="$HOME/openssl/bin:$PATH"
          ./src/app/tlsrelay version | tee version.txt
          grep -q "OpenSSL 3\.5\." version.txt
          ctest --output-on-failure -j 2

  analysis:
    name: Analyse statique (clang-tidy, cppcheck)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Dépendances
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libssl-dev libasio-dev \
            libyaml-cpp-dev libspdlog-dev libcli11-dev libgtest-dev clang-tidy-18 cppcheck qt6-base-dev

      - name: Base de compilation
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DTLSRELAY_BUILD_ADMIN=ON

      - name: clang-tidy
        run: tools/run-clang-tidy.sh build

      - name: cppcheck
        run: tools/run-cppcheck.sh build

  fuzz:
    name: Fuzzing (60 s par cible)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Dépendances
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libssl-dev libasio-dev \
            libyaml-cpp-dev libspdlog-dev libcli11-dev libclang-rt-18-dev

      - name: Compilation
        run: |
          cmake --preset linux-fuzz -DTLSRELAY_WARNINGS_AS_ERRORS=ON
          cmake --build --preset linux-fuzz

      - name: Fuzzing
        run: tools/run-fuzz.sh build/linux-fuzz 60

      - name: Entrées qui ont fait échouer une cible
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: build/fuzz-artifacts/

  windows-analyze:
    name: Windows MSVC /analyze
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-cache
    steps:
      - uses: actions/checkout@v4

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\vcpkg-cache
          key: vcpkg-x64-windows-${{ hashFiles('vcpkg.json', 'vcpkg-overlays/**') }}
          restore-keys: vcpkg-x64-windows-

      - name: Préparation
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configuration (/analyze, alertes en erreurs)
        run: cmake --preset windows-msvc -DTLSRELAY_BUILD_TESTS=OFF -DTLSRELAY_MSVC_ANALYZE=ON -DTLSRELAY_WARNINGS_AS_ERRORS=ON

      - name: Analyse (relais et testkit)
        run: cmake --build --preset windows-release

  windows:
    name: Windows MSVC Release
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-cache
    steps:
      - uses: actions/checkout@v4

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\vcpkg-cache
          key: vcpkg-x64-windows-${{ hashFiles('vcpkg.json', 'vcpkg-overlays/**') }}
          restore-keys: vcpkg-x64-windows-

      - name: Préparation
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Qt 6.8 LTS (éditeur tlsrelay-admin)
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: win64_msvc2022_64
          cache: true

      - name: Configuration
        shell: pwsh
        run: cmake --preset windows-msvc -DTLSRELAY_WARNINGS_AS_ERRORS=ON -DTLSRELAY_BUILD_ADMIN=ON "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR"

      - name: Compilation
        run: cmake --build --preset windows-release

      - name: Tests
        run: ctest --preset windows-release -j 2

      - name: Durcissement des exécutables
        shell: pwsh
        run: .\tools\check-hardening.ps1 build\windows-msvc\src\app\Release\tlsrelay.exe build\windows-msvc\src\testkit\Release\tlsrelay-testkit.exe

      - name: Version d'OpenSSL embarquée (3.5 LTS attendue)
        shell: pwsh
        run: |
          $out = .\build\windows-msvc\src\app\Release\tlsrelay.exe version
          $out
          if (-not ($out -match 'OpenSSL 3\.5\.')) { throw "OpenSSL 3.5.x attendu" }

      - name: Cycle de vie du service Windows (service réel)
        shell: pwsh
        run: .\tests\lifecycle\windows-service.ps1 -BuildDir build\windows-msvc\src\app\Release

      - name: PKI en ligne de commande (mini-AC)
        shell: pwsh
        run: .\tests\lifecycle\windows-pki.ps1 -BuildDir build\windows-msvc\src\app\Release

      - name: Paquet MSI
        shell: pwsh
        run: |
          Set-Location build\windows-msvc
          cpack -C Release -G WIX
          if ($LASTEXITCODE -ne 0) { throw "cpack" }
          Get-ChildItem *.msi | ForEach-Object { $_.Name; (Get-FileHash -Algorithm SHA256 $_).Hash }

      - name: Installation du MSI
        shell: pwsh
        run: |
          $msi = (Get-ChildItem build\windows-msvc\*.msi).FullName
          $p = Start-Process msiexec -ArgumentList "/i `"$msi`" /qn ADDLOCAL=ALL /l*v `"$env:RUNNER_TEMP\msi-install.log`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\msi-install.log" -Tail 40; throw "installation du MSI : $($p.ExitCode)" }
          Get-ChildItem "$env:ProgramFiles\tlsrelay" -Recurse | Select-Object -ExpandProperty FullName
          & "$env:ProgramFiles\tlsrelay\bin\tlsrelay.exe" version

      - name: Éditeur installé (DLL Qt déployées, contrôle sans fenêtre)
        shell: pwsh
        run: |
          # Sans le Qt du runner : l'éditeur ne doit dépendre que des fichiers installés.
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -and $_ -notmatch '[\\/]Qt[\\/]' }) -join ';'
          foreach ($v in 'QT_PLUGIN_PATH', 'QT_ROOT_DIR', 'QML2_IMPORT_PATH') { Remove-Item "Env:$v" -ErrorAction SilentlyContinue }
          $root = "$env:ProgramFiles\tlsrelay"
          $admin = "$root\bin\tlsrelay-admin.exe"
          foreach ($f in "$root\bin\Qt6Core.dll", "$root\bin\Qt6Widgets.dll", "$root\doc\LICENSES\LGPL-3.0.txt",
                         "$root\doc\LICENSES\GPL-3.0.txt", "$root\doc\EDITEUR.md") {
            if (-not (Test-Path $f)) { throw "$f absent" }
          }
          if (-not (Get-ChildItem $root -Recurse -Filter qwindows.dll)) { throw "module de plateforme qwindows.dll absent" }
          $shortcut = Get-ChildItem "$env:ProgramData\Microsoft\Windows\Start Menu\Programs", "$env:APPDATA\Microsoft\Windows\Start Menu\Programs" `
            -Recurse -Filter 'tlsrelay-admin.lnk' -ErrorAction SilentlyContinue
          if (-not $shortcut) { throw "raccourci tlsrelay-admin absent du menu Démarrer" }
          $shortcut.FullName
          $report = "$env:RUNNER_TEMP\admin-check.txt"
          $p = Start-Process $admin -ArgumentList '--check', "`"$PWD\examples\client.yaml`"", '--report', "`"$report`"" -Wait -PassThru
          if (Test-Path $report) { Get-Content $report }
          if ($p.ExitCode -ne 0) { throw "tlsrelay-admin --check : code $($p.ExitCode)" }
          $p = Start-Process $admin -ArgumentList '--check', "`"$PWD\tests\admin\invalide.yaml`"", '--report', "`"$report`"" -Wait -PassThru
          Get-Content $report
          if ($p.ExitCode -ne 1) { throw "fichier invalide : code $($p.ExitCode), 1 attendu" }

      - name: Recette automatisée sur les binaires installés (services Windows)
        shell: pwsh
        run: .\tools\recette.ps1 -BuildDir "$env:ProgramFiles\tlsrelay\bin" -Services -Quick -WorkDir "$env:ProgramData\tlsrelay\recette-ci"

      - name: Désinstallation du MSI
        shell: pwsh
        run: |
          $msi = (Get-ChildItem build\windows-msvc\*.msi).FullName
          $p = Start-Process msiexec -ArgumentList "/x `"$msi`" /qn" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "désinstallation du MSI : $($p.ExitCode)" }
          if (Test-Path "$env:ProgramFiles\tlsrelay\bin\tlsrelay.exe") { throw "tlsrelay.exe encore présent" }
          if (Test-Path "$env:ProgramFiles\tlsrelay\bin\tlsrelay-admin.exe") { throw "tlsrelay-admin.exe encore présent" }

      - name: Paquet MSI (artefact)
        uses: actions/upload-artifact@v4
        with:
          name: paquet-msi
          path: build/windows-msvc/*.msi

      - name: Rapport de recette (Windows)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recette-windows
          path: |
            C:\ProgramData\tlsrelay\recette-ci\rapport.md
            C:\ProgramData\tlsrelay\recette-ci\logs\
          if-no-files-found: ignore

  linux-packages:
    name: Paquets ${{ matrix.kind }} (${{ matrix.image }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "ubuntu:22.04", kind: deb }
          - { image: "rockylinux:9", kind: rpm }
    steps:
      - uses: actions/checkout@v4

      - name: Construction et tests sur la distribution
        run: docker run --rm -v "$PWD:/src" -w /src ${{ matrix.image }} packaging/build-linux.sh paquets

      - name: Paquets
        run: |
          sudo chown -R "$(id -u):$(id -g)" paquets
          ls -l paquets
          sha256sum paquets/*

      - uses: actions/upload-artifact@v4
        with:
          name: paquets-${{ matrix.kind }}
          path: paquets/

  linux-packages-install:
    name: Installation ${{ matrix.kind }} (${{ matrix.image }})
    needs: linux-packages
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "ubuntu:22.04", kind: deb }
          - { image: "ubuntu:24.04", kind: deb }
          - { image: "debian:12", kind: deb }
          - { image: "rockylinux:9", kind: rpm }
          - { image: "almalinux:9", kind: rpm }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: paquets-${{ matrix.kind }}
          path: paquets

      - name: Installation, échange mTLS, désinstallation
        run: docker run --rm -v "$PWD:/src" -w /src ${{ matrix.image }} packaging/test-linux-package.sh paquets

  release-files:
    name: Paquets de la livraison
    needs: [linux-packages-install, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: livraison
          pattern: paquet*
          merge-multiple: true

      - name: Empreintes
        working-directory: livraison
        run: |
          sha256sum * | tee SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: tlsrelay-livraison
          path: livraison/
