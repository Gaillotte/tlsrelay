name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "GCC Release", cxx: g++, build_type: Release, sanitizers: "" }
          - { name: "Clang Release", cxx: clang++, build_type: Release, sanitizers: "" }
          - { name: "Clang ASan+UBSan", cxx: clang++, build_type: Debug, sanitizers: "address,undefined" }
          - { name: "Clang TSan", cxx: clang++, build_type: Debug, sanitizers: "thread" }
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libssl-dev libasio-dev \
            libyaml-cpp-dev libspdlog-dev libcli11-dev libgtest-dev libclang-rt-18-dev qt6-base-dev

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DTLSRELAY_WARNINGS_AS_ERRORS=ON
          -DTLSRELAY_BUILD_ADMIN=ON
          -DTLSRELAY_SANITIZERS=${{ matrix.sanitizers }}

      - name: Build
        run: cmake --build build

      - name: Tests
        working-directory: build
        env:
          # Suppressions: races reported in Qt, which is not instrumented (tests/tsan.supp).
          TSAN_OPTIONS: halt_on_error=1 suppressions=${{ github.workspace }}/tests/tsan.supp
        run: ctest --output-on-failure -j 2

      - name: Lifecycle under systemd (real service)
        if: matrix.name == 'GCC Release'
        run: sudo bash tests/lifecycle/systemd.sh build/src/app/tlsrelay

      - name: TLS configuration seen from outside (sslyze, testssl.sh)
        if: matrix.name == 'GCC Release'
        run: |
          python3 -m venv /tmp/sslyze
          /tmp/sslyze/bin/pip install -q sslyze
          git clone -q --depth 1 --branch v3.2.1 https://github.com/testssl/testssl.sh.git /tmp/testssl
          TESTSSL=/tmp/testssl/testssl.sh PATH="/tmp/sslyze/bin:$PATH" bash tests/lifecycle/tls-scan.sh build/src/app/tlsrelay

      - name: Dependency vulnerabilities
        if: matrix.name == 'GCC Release'
        run: bash tools/check-deps.sh

      - name: Executable hardening
        if: matrix.name == 'GCC Release'
        run: bash tools/check-hardening.sh build/src/app/tlsrelay build/src/testkit/tlsrelay-testkit

      - name: Automated acceptance (console mode)
        if: matrix.name == 'GCC Release'
        shell: pwsh
        run: ./tools/acceptance.ps1 -BuildDir build/src/app -TestkitDir build/src/testkit -Quick -WorkDir acceptance

      - name: Acceptance report (Linux)
        if: always() && matrix.name == 'GCC Release'
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-linux
          path: |
            acceptance/report.md
            acceptance/logs/
          if-no-files-found: ignore

  perf:
    name: Performance (1,000 channels) and soak (4 min)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libssl-dev libasio-dev \
            libyaml-cpp-dev libspdlog-dev libcli11-dev

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DTLSRELAY_BUILD_TESTS=OFF
          cmake --build build

      - name: Performance targets
        run: bash tests/perf/perf.sh build 1000 perf.json

      - name: Soak (rotations, renegotiations, cuts)
        run: bash tests/perf/soak.sh build 4 soak.csv

      - name: Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance
          path: |
            perf.json
            soak.csv

  openssl35:
    name: Linux OpenSSL 3.5 LTS
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      OPENSSL_VERSION: 3.5.9
      OPENSSL_SHA512: c4c8136fd2c98d13bb85a57bfb0def25c906f47f1fe97675cd114594944eab957b5b81a3e0f48826e1a0f093afff5e83766b539d49768f6db68310fd678d7de6
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libasio-dev libyaml-cpp-dev \
            libspdlog-dev libcli11-dev libgtest-dev

      - name: Cache OpenSSL
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/openssl
          key: openssl-${{ env.OPENSSL_VERSION }}-ssldirs-ubuntu-24.04

      - name: OpenSSL ${{ env.OPENSSL_VERSION }} (verified official archive)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSLO "https://github.com/openssl/openssl/releases/download/openssl-$OPENSSL_VERSION/openssl-$OPENSSL_VERSION.tar.gz"
          echo "$OPENSSL_SHA512  openssl-$OPENSSL_VERSION.tar.gz" | sha512sum -c -
          tar xzf "openssl-$OPENSSL_VERSION.tar.gz"
          cd "openssl-$OPENSSL_VERSION"
          ./Configure --prefix="$HOME/openssl" --libdir=lib shared no-tests
          make -j"$(nproc)" >/dev/null
          make install_sw install_ssldirs >/dev/null  # install_ssldirs: openssl.cnf (openssl req command)

      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DTLSRELAY_WARNINGS_AS_ERRORS=ON \
            -DOPENSSL_ROOT_DIR="$HOME/openssl"
          cmake --build build

      - name: Tests
        working-directory: build
        env:
          LD_LIBRARY_PATH: /home/runner/openssl/lib
        # The scenarios also use the openssl command: the one from the same version.
        run: |
          export PATH="$HOME/openssl/bin:$PATH"
          ./src/app/tlsrelay version | tee version.txt
          grep -q "OpenSSL 3\.5\." version.txt
          ctest --output-on-failure -j 2

  analysis:
    name: Static analysis (clang-tidy, cppcheck)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libssl-dev libasio-dev \
            libyaml-cpp-dev libspdlog-dev libcli11-dev libgtest-dev clang-tidy-18 cppcheck qt6-base-dev

      - name: Compilation database
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DTLSRELAY_BUILD_ADMIN=ON

      - name: clang-tidy
        run: tools/run-clang-tidy.sh build

      - name: cppcheck
        run: tools/run-cppcheck.sh build

  coverage:
    name: Code coverage (gcovr)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libssl-dev libasio-dev \
            libyaml-cpp-dev libspdlog-dev libcli11-dev libgtest-dev qt6-base-dev
          pipx install gcovr==8.6

      # Project target: at least 90 % of the lines of the shipped code (TESTS.md §6).
      # All ctest tests, then the systemd lifecycle as root (real service), then the report.
      - name: Instrumented tests and report
        env:
          COVERAGE_EXTRA: sudo bash tests/lifecycle/systemd.sh build/coverage/src/app/tlsrelay
        run: tools/coverage.sh build/coverage 90

      - name: Coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: build/coverage/coverage/
          if-no-files-found: ignore

  fuzz:
    name: Fuzzing (60 s per target)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libssl-dev libasio-dev \
            libyaml-cpp-dev libspdlog-dev libcli11-dev libclang-rt-18-dev

      - name: Build
        run: |
          cmake --preset linux-fuzz -DTLSRELAY_WARNINGS_AS_ERRORS=ON
          cmake --build --preset linux-fuzz

      - name: Fuzzing
        run: tools/run-fuzz.sh build/linux-fuzz 60

      - name: Inputs that made a target fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: build/fuzz-artifacts/

  windows-analyze:
    name: Windows MSVC /analyze
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-cache
    steps:
      - uses: actions/checkout@v4

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\vcpkg-cache
          key: vcpkg-x64-windows-${{ hashFiles('vcpkg.json', 'vcpkg-overlays/**') }}
          restore-keys: vcpkg-x64-windows-

      - name: Setup
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure (/analyze, warnings as errors)
        run: cmake --preset windows-msvc -DTLSRELAY_BUILD_TESTS=OFF -DTLSRELAY_MSVC_ANALYZE=ON -DTLSRELAY_WARNINGS_AS_ERRORS=ON

      - name: Analysis (relay and testkit)
        run: cmake --build --preset windows-release

  windows:
    name: Windows MSVC Release
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-cache
    steps:
      - uses: actions/checkout@v4

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\vcpkg-cache
          key: vcpkg-x64-windows-${{ hashFiles('vcpkg.json', 'vcpkg-overlays/**') }}
          restore-keys: vcpkg-x64-windows-

      - name: Setup
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Qt 6.8 LTS (tlsrelay-admin editor)
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: win64_msvc2022_64
          cache: true

      - name: Configure
        shell: pwsh
        run: cmake --preset windows-msvc -DTLSRELAY_WARNINGS_AS_ERRORS=ON -DTLSRELAY_BUILD_ADMIN=ON "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR"

      - name: Build
        run: cmake --build --preset windows-release

      - name: Tests
        run: ctest --preset windows-release -j 2

      - name: Executable hardening
        shell: pwsh
        run: .\tools\check-hardening.ps1 build\windows-msvc\src\app\Release\tlsrelay.exe build\windows-msvc\src\testkit\Release\tlsrelay-testkit.exe

      - name: Bundled OpenSSL version (3.5 LTS expected)
        shell: pwsh
        run: |
          $out = .\build\windows-msvc\src\app\Release\tlsrelay.exe version
          $out
          if (-not ($out -match 'OpenSSL 3\.5\.')) { throw "OpenSSL 3.5.x expected" }

      - name: Windows service lifecycle (real service)
        shell: pwsh
        run: .\tests\lifecycle\windows-service.ps1 -BuildDir build\windows-msvc\src\app\Release

      - name: Command-line PKI (mini-CA)
        shell: pwsh
        run: .\tests\lifecycle\windows-pki.ps1 -BuildDir build\windows-msvc\src\app\Release

      - name: MSI package
        shell: pwsh
        run: |
          Set-Location build\windows-msvc
          cpack -C Release -G WIX
          if ($LASTEXITCODE -ne 0) { throw "cpack" }
          Get-ChildItem *.msi | ForEach-Object { $_.Name; (Get-FileHash -Algorithm SHA256 $_).Hash }

      - name: MSI installation
        shell: pwsh
        run: |
          $msi = (Get-ChildItem build\windows-msvc\*.msi).FullName
          $p = Start-Process msiexec -ArgumentList "/i `"$msi`" /qn ADDLOCAL=ALL /l*v `"$env:RUNNER_TEMP\msi-install.log`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\msi-install.log" -Tail 40; throw "MSI installation: $($p.ExitCode)" }
          Get-ChildItem "$env:ProgramFiles\tlsrelay" -Recurse | Select-Object -ExpandProperty FullName
          & "$env:ProgramFiles\tlsrelay\bin\tlsrelay.exe" version

      - name: Installed editor (Qt DLLs deployed, check without a window)
        shell: pwsh
        run: |
          # Without the runner's Qt: the editor must depend only on the installed files.
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -and $_ -notmatch '[\\/]Qt[\\/]' }) -join ';'
          foreach ($v in 'QT_PLUGIN_PATH', 'QT_ROOT_DIR', 'QML2_IMPORT_PATH') { Remove-Item "Env:$v" -ErrorAction SilentlyContinue }
          $root = "$env:ProgramFiles\tlsrelay"
          $admin = "$root\bin\tlsrelay-admin.exe"
          foreach ($f in "$root\bin\Qt6Core.dll", "$root\bin\Qt6Widgets.dll", "$root\doc\LICENSES\LGPL-3.0.txt",
                         "$root\doc\LICENSES\GPL-3.0.txt", "$root\doc\EDITOR.md") {
            if (-not (Test-Path $f)) { throw "$f missing" }
          }
          if (-not (Get-ChildItem $root -Recurse -Filter qwindows.dll)) { throw "platform plugin qwindows.dll missing" }
          # Per-machine installation: shortcut in the common Start menu.
          $shortcut = Get-ChildItem "$env:ProgramData\Microsoft\Windows\Start Menu\Programs" `
            -Recurse -Filter 'tlsrelay-admin.lnk' -ErrorAction SilentlyContinue
          if (-not $shortcut) { throw "tlsrelay-admin shortcut missing from the common Start menu" }
          $shortcut.FullName
          $report = "$env:RUNNER_TEMP\admin-check.txt"
          $p = Start-Process $admin -ArgumentList '--check', "`"$PWD\examples\client.yaml`"", '--report', "`"$report`"" -Wait -PassThru
          if (Test-Path $report) { Get-Content $report }
          if ($p.ExitCode -ne 0) { throw "tlsrelay-admin --check: code $($p.ExitCode)" }
          $p = Start-Process $admin -ArgumentList '--check', "`"$PWD\tests\admin\invalid.yaml`"", '--report', "`"$report`"" -Wait -PassThru
          Get-Content $report
          if ($p.ExitCode -ne 1) { throw "invalid file: code $($p.ExitCode), 1 expected" }

      - name: Automated acceptance on the installed binaries (Windows services)
        shell: pwsh
        run: .\tools\acceptance.ps1 -BuildDir "$env:ProgramFiles\tlsrelay\bin" -Services -Quick -WorkDir "$env:ProgramData\tlsrelay\acceptance-ci"

      - name: MSI uninstallation
        shell: pwsh
        run: |
          $msi = (Get-ChildItem build\windows-msvc\*.msi).FullName
          $p = Start-Process msiexec -ArgumentList "/x `"$msi`" /qn" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "MSI uninstallation: $($p.ExitCode)" }
          if (Test-Path "$env:ProgramFiles\tlsrelay\bin\tlsrelay.exe") { throw "tlsrelay.exe still present" }
          if (Test-Path "$env:ProgramFiles\tlsrelay\bin\tlsrelay-admin.exe") { throw "tlsrelay-admin.exe still present" }

      - name: MSI package (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: package-msi
          path: build/windows-msvc/*.msi

      - name: Acceptance report (Windows)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-windows
          path: |
            C:\ProgramData\tlsrelay\acceptance-ci\report.md
            C:\ProgramData\tlsrelay\acceptance-ci\logs\
          if-no-files-found: ignore

  linux-packages:
    name: Packages ${{ matrix.kind }} (${{ matrix.image }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "ubuntu:22.04", kind: deb }
          - { image: "rockylinux:9", kind: rpm }
    steps:
      - uses: actions/checkout@v4

      - name: Build and tests on the distribution
        run: docker run --rm -v "$PWD:/src" -w /src ${{ matrix.image }} packaging/build-linux.sh packages

      - name: Packages
        run: |
          sudo chown -R "$(id -u):$(id -g)" packages
          ls -l packages
          sha256sum packages/*

      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.kind }}
          path: packages/

  linux-packages-install:
    name: Install ${{ matrix.kind }} (${{ matrix.image }})
    needs: linux-packages
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "ubuntu:22.04", kind: deb }
          - { image: "ubuntu:24.04", kind: deb }
          - { image: "debian:12", kind: deb }
          - { image: "rockylinux:9", kind: rpm }
          - { image: "almalinux:9", kind: rpm }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: packages-${{ matrix.kind }}
          path: packages

      - name: Install, mTLS exchange, uninstall
        run: docker run --rm -v "$PWD:/src" -w /src ${{ matrix.image }} packaging/test-linux-package.sh packages

  release-files:
    name: Release packages
    needs: [linux-packages-install, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          pattern: package*
          merge-multiple: true

      - name: Hashes
        working-directory: release
        run: |
          sha256sum * | tee SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: tlsrelay-release
          path: release/
