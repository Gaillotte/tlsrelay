name: Nightly measurements

# PLAN §5.5: every night, full performance targets (5,000 channels) and a
# 30 min soak; reports published as artifacts. A GitHub-hosted job is
# limited to 6 h: the 72 h soak before release runs on a
# dedicated machine (tests/perf/soak.sh <build> 4320).
on:
  schedule:
    - cron: "43 2 * * *"
  workflow_dispatch:
    inputs:
      soak_minutes:
        description: Soak duration in minutes (330 at most on a GitHub runner)
        default: "30"

permissions:
  contents: read

jobs:
  perf:
    name: Performance (5,000 channels) and soak
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libssl-dev libasio-dev \
            libyaml-cpp-dev libspdlog-dev libcli11-dev

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DTLSRELAY_BUILD_TESTS=OFF
          cmake --build build

      - name: Performance targets (5,000 channels)
        run: |
          ulimit -n 65536
          bash tests/perf/perf.sh build 5000 perf.json

      - name: Soak
        run: bash tests/perf/soak.sh build "${{ github.event.inputs.soak_minutes || '30' }}" soak.csv

      - name: Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-measurements
          path: |
            perf.json
            soak.csv
